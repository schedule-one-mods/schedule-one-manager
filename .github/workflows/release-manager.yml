name: Build and release manager

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manager-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Test and package standalone manager
        id: package
        shell: pwsh
        run: ./manager/build.ps1 -Installer
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ScheduleIModManager-${{ steps.package.outputs.version }}-win-x64
          path: ${{ steps.package.outputs.release_dir }}/*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ScheduleIModManager-${{ needs.build.outputs.version }}-win-x64
          path: release-assets
      - name: Publish a new version once
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APP_VERSION: ${{ needs.build.outputs.version }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${APP_VERSION}"
          gh api --paginate "repos/${GH_REPO}/releases" --jq '.[].tag_name' > published-tags.txt
          if grep -Fxq "$tag" published-tags.txt; then
            echo "Release $tag already exists. This commit is available as an Actions artifact. Bump manager/Directory.Build.props to publish another release."
            exit 0
          fi
          # Never publish binaries against a manually created tag pointing elsewhere.
          gh api "repos/${GH_REPO}/git/matching-refs/tags/${tag}" --jq '.[].ref' > matching-tags.txt
          if grep -Fxq "refs/tags/${tag}" matching-tags.txt; then
            tagged_sha=$(gh api "repos/${GH_REPO}/commits/${tag}" --jq '.sha')
            if [[ "$tagged_sha" != "$COMMIT_SHA" ]]; then
              echo "Tag $tag already points to another commit. Bump the version or correct that tag before publishing."
              exit 1
            fi
          fi
          gh release create "$tag" release-assets/* \
            --repo "$GH_REPO" --target "$COMMIT_SHA" \
            --title "Schedule I Mod Manager ${APP_VERSION}" \
            --notes "Windows x64 manager only. Download the MSI installer or extract the portable ZIP. SHA-256 checksum files are included. These development binaries are unsigned. No mods or game files are bundled."
